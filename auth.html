<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#091e1d" />
    <meta
      name="description"
      content="Choose a browser-local commander profile for Dawn of Warriors."
    />
    <title>DAWN OF WARRIORS: ANCIENT TIMES</title>
    <style>
      :root {
        --bg-1: #031914;
        --bg-2: #062b2d;
        --bg-3: #0b1f2a;
        --panel: rgba(6, 20, 22, 0.8);
        --panel-strong: rgba(9, 19, 21, 0.94);
        --line: rgba(122, 224, 220, 0.36);
        --line-soft: rgba(122, 224, 220, 0.15);
        --gold: #e7c782;
        --gold-2: #d3a74d;
        --teal: #7ee7ec;
        --teal-2: #3acca9;
        --text: #edf9f8;
        --muted: #dbe7e3;
        --shadow: rgba(0, 0, 0, 0.5);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(
            circle at 12% 12%,
            rgba(28, 121, 108, 0.7),
            transparent 26%
          ),
          radial-gradient(
            circle at 82% 7%,
            rgba(128, 94, 171, 0.74),
            transparent 24%
          ),
          linear-gradient(
            135deg,
            var(--bg-1),
            var(--bg-2) 42%,
            var(--bg-3) 100%
          );
        color: var(--text);
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        display: grid;
        place-items: center;
        padding: 20px;
      }

      .shell {
        width: min(1280px, 100%);
        min-height: min(92vh, 820px);
        background: rgba(4, 15, 18, 0.78);
        border: 1px solid var(--line-soft);
        border-radius: 22px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.42);
        overflow: hidden;
      }

      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 18px 26px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        background: rgba(10, 25, 27, 0.8);
      }

      .brand {
        font-size: 1rem;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: var(--gold);
      }

      .status {
        border: 1px solid rgba(126, 231, 236, 0.6);
        border-radius: 999px;
        padding: 8px 18px;
        font-size: 0.66rem;
        text-transform: uppercase;
        letter-spacing: 0.2em;
        color: var(--teal);
        background: rgba(126, 231, 236, 0.06);
        transition: all 0.2s ease;
      }

      .status.loading {
        color: #9bc7ff;
        border-color: rgba(95, 160, 255, 0.7);
        background: rgba(86, 147, 255, 0.08);
      }

      .status.success {
        color: #9de8b8;
        border-color: rgba(91, 210, 142, 0.7);
        background: rgba(44, 170, 110, 0.1);
      }

      .status.error {
        color: #ffb5b5;
        border-color: rgba(255, 116, 116, 0.7);
        background: rgba(180, 46, 46, 0.12);
      }

      .layout {
        display: grid;
        grid-template-columns: minmax(300px, 420px) minmax(0, 1fr);
        min-height: calc(100% - 72px);
      }

      .battlefield-pane {
        position: relative;
        min-height: 560px;
        padding: 18px;
        border-right: 1px solid rgba(255, 255, 255, 0.08);
        background: rgba(8, 20, 21, 0.72);
      }

      .battlefield-stage {
        position: relative;
        width: 100%;
        height: 100%;
        min-height: 560px;
        overflow: hidden;
        border-radius: 18px;
        border: 1px solid rgba(126, 231, 236, 0.2);
        background: #061a1a;
      }

      .scene {
        position: absolute;
        inset: 0;
        opacity: 0;
        transition: opacity 1.2s ease 3s;
        background-size: cover;
        background-position: center;
        filter: saturate(0.9) contrast(1.08) brightness(0.8);
      }

      .scene.active {
        opacity: 1;
      }

      .consent-row {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        margin-top: 4px;
        color: var(--muted);
        font-size: 0.72rem;
        letter-spacing: 0.08em;
        line-height: 1.5;
      }

      .consent-row input {
        width: 18px;
        height: 18px;
        min-width: 18px;
        margin-top: 2px;
      }

      .scene-1 {
        background-image: url("./assets/historical/roman-empire.jpeg");
        background-size: cover;
        background-position: center;
      }

      .scene-2 {
        background-image: url("./assets/historical/ancient-greece.jpeg");
        background-size: cover;
        background-position: center;
      }

      .scene-3 {
        background-image: url("./assets/historical/babylonian-empire.jpeg");
        background-size: cover;
        background-position: center;
      }

      .scene-4 {
        background-image: url("./assets/historical/byzantine-empire.jpeg");
        background-size: cover;
        background-position: center;
      }

      .scene-5 {
        background-image: url("./assets/historical/islamic-empire.jpeg");
        background-size: cover;
        background-position: center;
      }

      .scene-6 {
        background-image: url("./assets/historical/japanese-empire.jpeg");
        background-size: cover;
        background-position: center;
      }

      .scene-7 {
        background-image: url("./assets/historical/macedonian-empire.jpeg");
        background-size: cover;
        background-position: center;
      }

      .scene-8 {
        background-image: url("./assets/historical/qing-dynasty.jpeg");
        background-size: cover;
        background-position: center;
      }

      .scene-9 {
        background-image: url("./assets/historical/the-holy-roman-empire.jpeg");
        background-size: cover;
        background-position: center;
      }

      .scene-10 {
        background-image: url("./assets/historical/nazi-germany.jpeg");
        background-size: cover;
        background-position: center;
      }

      .panel {
        padding: 26px 24px 24px;
        background: rgba(13, 20, 21, 0.62);
      }

      .tab-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-bottom: 20px;
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid rgba(255, 255, 255, 0.09);
        border-radius: 18px;
        padding: 8px;
      }

      .tab {
        border: 1px solid transparent;
        background: transparent;
        color: var(--muted);
        border-radius: 12px;
        padding: 18px 12px;
        font-size: 0.8rem;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        font-weight: 700;
        cursor: pointer;
      }

      .tab.active {
        background: rgba(126, 231, 236, 0.08);
        border-color: rgba(126, 231, 236, 0.45);
        color: var(--teal);
      }

      .card {
        border: 1px solid rgba(126, 231, 236, 0.18);
        border-radius: 18px;
        background: rgba(8, 17, 18, 0.72);
        padding: 18px 18px 16px;
      }

      form {
        display: grid;
        gap: 18px;
      }

      label {
        display: grid;
        gap: 8px;
        font-size: 0.7rem;
        color: var(--gold);
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }

      .field-hint {
        color: var(--muted);
        font-size: 0.75rem;
        letter-spacing: 0;
        line-height: 1.5;
        text-transform: none;
      }

      input,
      select {
        width: 100%;
        border: 1px solid rgba(126, 231, 236, 0.28);
        border-radius: 14px;
        background: rgba(245, 250, 251, 0.92);
        color: #091d1f;
        padding: 16px 18px;
        font-size: 1rem;
        outline: none;
      }

      input:focus,
      select:focus {
        border-color: rgba(126, 231, 236, 0.82);
        box-shadow: 0 0 0 3px rgba(126, 231, 236, 0.12);
      }

      .button {
        border: none;
        width: 100%;
        border-radius: 14px;
        background: linear-gradient(135deg, #7dddf0, #69c0d3);
        color: #061c22;
        padding: 20px 12px;
        font-size: 1rem;
        font-weight: 900;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        cursor: pointer;
        box-shadow: 0 10px 24px rgba(62, 158, 190, 0.18);
      }

      .helper {
        margin-top: 18px;
        text-align: center;
        font-size: 0.8rem;
        color: var(--muted);
      }

      .helper a {
        color: var(--teal);
        text-decoration: none;
        font-weight: 700;
      }

      .footer-note {
        margin-top: 18px;
        text-align: center;
        color: rgba(222, 227, 225, 0.82);
        font-size: 0.72rem;
        letter-spacing: 0.08em;
      }

      .message {
        min-height: 18px;
        font-size: 0.8rem;
        color: var(--teal);
        margin-bottom: 8px;
      }

      .message.error {
        color: #ffd0d0;
      }

      .hidden {
        display: none !important;
      }

      @media (max-width: 980px) {
        .layout {
          grid-template-columns: 1fr;
        }

        .battlefield-pane {
          min-height: 260px;
          border-right: none;
          border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .battlefield-stage {
          min-height: 260px;
        }
      }
    </style>
  </head>
  <body data-audio-scene="auth">
    <div class="shell">
      <div class="header">
        <div class="brand">Dawn of Warriors</div>
        <div class="status" id="status">Local profiles</div>
      </div>

      <div class="layout">
        <aside
          class="battlefield-pane"
          aria-label="Historical battlefield gallery"
        >
          <div class="battlefield-stage">
            <div class="scene scene-1 active"></div>
            <div class="scene scene-2"></div>
            <div class="scene scene-3"></div>
            <div class="scene scene-4"></div>
            <div class="scene scene-5"></div>
            <div class="scene scene-6"></div>
            <div class="scene scene-7"></div>
            <div class="scene scene-8"></div>
            <div class="scene scene-9"></div>
            <div class="scene scene-10"></div>
          </div>
        </aside>

        <section class="panel">
          <div class="tab-row">
            <button class="tab active" type="button" data-view="login">
              Continue
            </button>
            <button class="tab" type="button" data-view="register">
              Create banner
            </button>
          </div>

          <div class="card">
            <div id="message" class="message"></div>

            <form id="loginForm">
              <label>
                Commander username
                <input
                  type="text"
                  id="loginName"
                  name="sovereign"
                  placeholder="Enter a saved username"
                  autocomplete="username"
                  required
                />
                <span class="field-hint">
                  Continue with a profile saved in this browser.
                </span>
              </label>

              <label class="consent-row">
                <input type="checkbox" name="terms" required />
                <span>I agree to the kingdom charter and campaign rules.</span>
              </label>

              <button class="button" type="submit">
                Enter the realm
              </button>
            </form>

            <form id="registerForm" class="hidden">
              <label>
                First name
                <input
                  type="text"
                  name="firstName"
                  placeholder="First name"
                  required
                />
              </label>

              <label>
                Last name
                <input
                  type="text"
                  name="lastName"
                  placeholder="Last name"
                  required
                />
              </label>

              <label>
                Commander username
                <input
                  type="text"
                  name="username"
                  autocomplete="username"
                  minlength="3"
                  maxlength="24"
                  pattern="[a-zA-Z0-9_]+"
                  placeholder="Choose a unique username"
                  required
                />
                <span class="field-hint">
                  3–24 characters; use letters, numbers, and underscores only.
                  Usernames are not case-sensitive.
                </span>
              </label>

              <label>
                Empire / kingdom
                <select name="empire" required>
                  <option value="">Select an empire</option>
                  <option>Rome</option>
                  <option>Babylon</option>
                  <option>Aurelian Republic</option>
                  <option>Han China</option>
                  <option>Byzantium</option>
                  <option>Carolingian Empire</option>
                  <option>Qin Empire</option>
                  <option>Tang Empire</option>
                  <option>Mongol Empire</option>
                  <option>Tokugawa Shogunate</option>
                  <option>Ashuran Dominion</option>
                  <option>Achaemenid Persia</option>
                  <option>Abbasid Caliphate</option>
                  <option>Ottoman Empire</option>
                  <option>Spartan League</option>
                  <option>Egyptian Dynasty</option>
                  <option>Khmer Empire</option>
                  <option>Viking Kingdoms</option>
                  <option>Aztec Dominion</option>
                  <option>Incan Empire</option>
                </select>
              </label>

              <label class="consent-row">
                <input type="checkbox" name="terms" required />
                <span>I agree to the kingdom charter and campaign rules.</span>
              </label>

              <button class="button" type="submit">Create local banner</button>
            </form>

          </div>

          <div class="helper">
            <span id="helperText">New to this browser? </span>
            <a href="#" id="switchLink">Create a local banner</a>
          </div>

          <div class="footer-note">
            Profiles and saves stay in this browser. They are not online
            accounts, and there is no server or email verification.
          </div>
        </section>
      </div>
    </div>

    <script
      src="./boot/audio-theme.js"
      onerror="this.onerror=null;this.src='./public/boot/audio-theme.js'"
    ></script>
    <script type="module" src="./src/auth.js"></script>
  </body>
</html>
