<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#091e1d" />
    <meta
      name="description"
      content="DAWN OF WARRIORS: ANCIENT TIMES — Secure your kingdom, sign in, register your banner, and verify your campaign email."
    />
    <meta name="game-api-origin" content="" />
    <title>DAWN OF WARRIORS: ANCIENT TIMES</title>
    <style>
      :root {
        --bg-1: #031914;
        --bg-2: #062b2d;
        --bg-3: #0b1f2a;
        --panel: rgba(6, 20, 22, 0.8);
        --panel-strong: rgba(9, 19, 21, 0.94);
        --line: rgba(122, 224, 220, 0.36);
        --line-soft: rgba(122, 224, 220, 0.15);
        --gold: #e7c782;
        --gold-2: #d3a74d;
        --teal: #7ee7ec;
        --teal-2: #3acca9;
        --text: #edf9f8;
        --muted: #dbe7e3;
        --shadow: rgba(0, 0, 0, 0.5);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(
            circle at 12% 12%,
            rgba(28, 121, 108, 0.7),
            transparent 26%
          ),
          radial-gradient(
            circle at 82% 7%,
            rgba(128, 94, 171, 0.74),
            transparent 24%
          ),
          linear-gradient(
            135deg,
            var(--bg-1),
            var(--bg-2) 42%,
            var(--bg-3) 100%
          );
        color: var(--text);
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        display: grid;
        place-items: center;
        padding: 20px;
      }

      .shell {
        width: min(1280px, 100%);
        min-height: min(92vh, 820px);
        background: rgba(4, 15, 18, 0.78);
        border: 1px solid var(--line-soft);
        border-radius: 22px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.42);
        overflow: hidden;
      }

      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 18px 26px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        background: rgba(10, 25, 27, 0.8);
      }

      .brand {
        font-size: 1rem;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: var(--gold);
      }

      .status {
        border: 1px solid rgba(126, 231, 236, 0.6);
        border-radius: 999px;
        padding: 8px 18px;
        font-size: 0.66rem;
        text-transform: uppercase;
        letter-spacing: 0.2em;
        color: var(--teal);
        background: rgba(126, 231, 236, 0.06);
        transition: all 0.2s ease;
      }

      .status.loading {
        color: #9bc7ff;
        border-color: rgba(95, 160, 255, 0.7);
        background: rgba(86, 147, 255, 0.08);
      }

      .status.success {
        color: #9de8b8;
        border-color: rgba(91, 210, 142, 0.7);
        background: rgba(44, 170, 110, 0.1);
      }

      .status.error {
        color: #ffb5b5;
        border-color: rgba(255, 116, 116, 0.7);
        background: rgba(180, 46, 46, 0.12);
      }

      .layout {
        display: grid;
        grid-template-columns: minmax(300px, 420px) minmax(0, 1fr);
        min-height: calc(100% - 72px);
      }

      .battlefield-pane {
        position: relative;
        min-height: 560px;
        padding: 18px;
        border-right: 1px solid rgba(255, 255, 255, 0.08);
        background: rgba(8, 20, 21, 0.72);
      }

      .battlefield-stage {
        position: relative;
        width: 100%;
        height: 100%;
        min-height: 560px;
        overflow: hidden;
        border-radius: 18px;
        border: 1px solid rgba(126, 231, 236, 0.2);
        background: #061a1a;
      }

      .scene {
        position: absolute;
        inset: 0;
        opacity: 0;
        transition: opacity 1.2s ease 3s;
        background-size: cover;
        background-position: center;
        filter: saturate(0.9) contrast(1.08) brightness(0.8);
      }

      .scene.active {
        opacity: 1;
      }

      .consent-row {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        margin-top: 4px;
        color: var(--muted);
        font-size: 0.72rem;
        letter-spacing: 0.08em;
        line-height: 1.5;
      }

      .consent-row input {
        width: 18px;
        height: 18px;
        min-width: 18px;
        margin-top: 2px;
      }

      .scene-1 {
        background-image: url("./assets/historical/roman-empire.jpeg");
        background-size: cover;
        background-position: center;
      }

      .scene-2 {
        background-image: url("./assets/historical/ancient-greece.jpeg");
        background-size: cover;
        background-position: center;
      }

      .scene-3 {
        background-image: url("./assets/historical/babylonian-empire.jpeg");
        background-size: cover;
        background-position: center;
      }

      .scene-4 {
        background-image: url("./assets/historical/byzantine-empire.jpeg");
        background-size: cover;
        background-position: center;
      }

      .scene-5 {
        background-image: url("./assets/historical/islamic-empire.jpeg");
        background-size: cover;
        background-position: center;
      }

      .scene-6 {
        background-image: url("./assets/historical/japanese-empire.jpeg");
        background-size: cover;
        background-position: center;
      }

      .scene-7 {
        background-image: url("./assets/historical/macedonian-empire.jpeg");
        background-size: cover;
        background-position: center;
      }

      .scene-8 {
        background-image: url("./assets/historical/qing-dynasty.jpeg");
        background-size: cover;
        background-position: center;
      }

      .scene-9 {
        background-image: url("./assets/historical/the-holy-roman-empire.jpeg");
        background-size: cover;
        background-position: center;
      }

      .scene-10 {
        background-image: url("./assets/historical/nazi-germany.jpeg");
        background-size: cover;
        background-position: center;
      }

      .panel {
        padding: 26px 24px 24px;
        background: rgba(13, 20, 21, 0.62);
      }

      .tab-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-bottom: 20px;
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid rgba(255, 255, 255, 0.09);
        border-radius: 18px;
        padding: 8px;
      }

      .tab {
        border: 1px solid transparent;
        background: transparent;
        color: var(--muted);
        border-radius: 12px;
        padding: 18px 12px;
        font-size: 0.8rem;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        font-weight: 700;
        cursor: pointer;
      }

      .tab.active {
        background: rgba(126, 231, 236, 0.08);
        border-color: rgba(126, 231, 236, 0.45);
        color: var(--teal);
      }

      .card {
        border: 1px solid rgba(126, 231, 236, 0.18);
        border-radius: 18px;
        background: rgba(8, 17, 18, 0.72);
        padding: 18px 18px 16px;
      }

      form {
        display: grid;
        gap: 18px;
      }

      label {
        display: grid;
        gap: 8px;
        font-size: 0.7rem;
        color: var(--gold);
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }

      .field-hint {
        color: var(--muted);
        font-size: 0.75rem;
        letter-spacing: 0;
        line-height: 1.5;
        text-transform: none;
      }

      input,
      select {
        width: 100%;
        border: 1px solid rgba(126, 231, 236, 0.28);
        border-radius: 14px;
        background: rgba(245, 250, 251, 0.92);
        color: #091d1f;
        padding: 16px 18px;
        font-size: 1rem;
        outline: none;
      }

      input:focus,
      select:focus {
        border-color: rgba(126, 231, 236, 0.82);
        box-shadow: 0 0 0 3px rgba(126, 231, 236, 0.12);
      }

      .button {
        border: none;
        width: 100%;
        border-radius: 14px;
        background: linear-gradient(135deg, #7dddf0, #69c0d3);
        color: #061c22;
        padding: 20px 12px;
        font-size: 1rem;
        font-weight: 900;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        cursor: pointer;
        box-shadow: 0 10px 24px rgba(62, 158, 190, 0.18);
      }

      .helper {
        margin-top: 18px;
        text-align: center;
        font-size: 0.8rem;
        color: var(--muted);
      }

      .helper a {
        color: var(--teal);
        text-decoration: none;
        font-weight: 700;
      }

      .footer-note {
        margin-top: 18px;
        text-align: center;
        color: rgba(222, 227, 225, 0.82);
        font-size: 0.72rem;
        letter-spacing: 0.08em;
      }

      .message {
        min-height: 18px;
        font-size: 0.8rem;
        color: var(--teal);
        margin-bottom: 8px;
      }

      .message.error {
        color: #ffd0d0;
      }

      .hidden {
        display: none !important;
      }

      @media (max-width: 980px) {
        .layout {
          grid-template-columns: 1fr;
        }

        .battlefield-pane {
          min-height: 260px;
          border-right: none;
          border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .battlefield-stage {
          min-height: 260px;
        }
      }
    </style>
  </head>
  <body data-audio-scene="auth">
    <div class="shell">
      <div class="header">
        <div class="brand">Dawn of Warriors</div>
        <div class="status" id="status">Realm access</div>
      </div>

      <div class="layout">
        <aside
          class="battlefield-pane"
          aria-label="Historical battlefield gallery"
        >
          <div class="battlefield-stage">
            <div class="scene scene-1 active"></div>
            <div class="scene scene-2"></div>
            <div class="scene scene-3"></div>
            <div class="scene scene-4"></div>
            <div class="scene scene-5"></div>
            <div class="scene scene-6"></div>
            <div class="scene scene-7"></div>
            <div class="scene scene-8"></div>
            <div class="scene scene-9"></div>
            <div class="scene scene-10"></div>
          </div>
        </aside>

        <section class="panel">
          <div class="tab-row">
            <button class="tab active" type="button" data-view="login">
              Sign in
            </button>
            <button class="tab" type="button" data-view="register">
              Create banner
            </button>
          </div>

          <div class="card">
            <div id="message" class="message"></div>

            <form id="loginForm">
              <label>
                Sovereign name
                <input
                  type="text"
                  id="loginName"
                  name="sovereign"
                  placeholder="Enter commander name"
                  autocomplete="username"
                  required
                />
                <span class="field-hint">
                  Enter the username you chose when creating your banner, or
                  the email address linked to your account.
                </span>
              </label>

              <label>
                Commander password
                <input
                  type="password"
                  id="loginPassword"
                  name="password"
                  placeholder="Enter commander password"
                  autocomplete="current-password"
                  required
                />
                <span class="field-hint">
                  Use the password you created when registering. If you
                  haven’t registered yet, choose Create Banner above.
                </span>
              </label>

              <label class="consent-row">
                <input type="checkbox" name="terms" required />
                <span>I agree to the kingdom charter and campaign rules.</span>
              </label>

              <button class="button" type="submit">
                Enter the throne room
              </button>
            </form>

            <form id="registerForm" class="hidden">
              <label>
                First name
                <input
                  type="text"
                  name="firstName"
                  placeholder="First name"
                  required
                />
              </label>

              <label>
                Last name
                <input
                  type="text"
                  name="lastName"
                  placeholder="Last name"
                  required
                />
              </label>

              <label>
                Commander username
                <input
                  type="text"
                  name="username"
                  autocomplete="username"
                  minlength="3"
                  maxlength="24"
                  pattern="[a-zA-Z0-9_]+"
                  placeholder="Choose a unique username"
                  required
                />
                <span class="field-hint">
                  3–24 characters; use letters, numbers, and underscores only.
                  Usernames are not case-sensitive.
                </span>
              </label>

              <label>
                Empire / kingdom
                <select name="empire" required>
                  <option value="">Select an empire</option>
                  <option>Rome</option>
                  <option>Babylon</option>
                  <option>Aurelian Republic</option>
                  <option>Han China</option>
                  <option>Byzantium</option>
                  <option>Carolingian Empire</option>
                  <option>Qin Empire</option>
                  <option>Tang Empire</option>
                  <option>Mongol Empire</option>
                  <option>Tokugawa Shogunate</option>
                  <option>Ashuran Dominion</option>
                  <option>Achaemenid Persia</option>
                  <option>Abbasid Caliphate</option>
                  <option>Ottoman Empire</option>
                  <option>Spartan League</option>
                  <option>Egyptian Dynasty</option>
                  <option>Khmer Empire</option>
                  <option>Viking Kingdoms</option>
                  <option>Aztec Dominion</option>
                  <option>Incan Empire</option>
                </select>
              </label>

              <label>
                Kingdom email
                <input
                  type="email"
                  name="email"
                  placeholder="commander@gmail.com"
                  required
                />
              </label>

              <label>
                Password
                <input
                  type="password"
                  name="password"
                  placeholder="Create a strong password"
                  autocomplete="new-password"
                  minlength="10"
                  maxlength="128"
                  required
                />
                <span class="field-hint">
                  10–128 characters, with at least one uppercase letter, one
                  lowercase letter, and one number.
                </span>
              </label>

              <label>
                Confirm password
                <input
                  type="password"
                  name="confirmPassword"
                  placeholder="Repeat your password"
                  autocomplete="new-password"
                  minlength="10"
                  maxlength="128"
                  required
                />
                <span class="field-hint">Enter the same password again.</span>
              </label>

              <label class="consent-row">
                <input type="checkbox" name="terms" required />
                <span>I agree to the kingdom charter and campaign rules.</span>
              </label>

              <button class="button" type="submit">Create banner</button>
            </form>

            <form id="verifyForm" class="hidden">
              <p id="verificationInstructions">
                Open the one-time link sent to your email to activate your
                account.
              </p>
              <button
                class="button hidden"
                id="verifyLocalButton"
                type="button"
              >
                Verify account in this preview
              </button>
              <button class="button secondary" id="resendButton" type="button">
                Resend verification email
              </button>
            </form>
          </div>

          <div class="helper">
            <span id="helperText">No account yet? </span>
            <a href="#" id="switchLink">Create one here</a>
          </div>

          <div class="footer-note">
            By entering, you accept the kingdom charter and campaign rules.
          </div>
        </section>
      </div>
    </div>

    <script src="public/boot/audio-theme.js"></script>
    <script>
      const status = document.getElementById("status");
      const tabs = [...document.querySelectorAll(".tab")];
      const loginForm = document.getElementById("loginForm");
      const registerForm = document.getElementById("registerForm");
      const verifyForm = document.getElementById("verifyForm");
      const messageBox = document.getElementById("message");
      const helperText = document.getElementById("helperText");
      const switchLink = document.getElementById("switchLink");
      const loginName = document.getElementById("loginName");
      const verifyLocalButton = document.getElementById("verifyLocalButton");
      const resendButton = document.getElementById("resendButton");
      const verificationInstructions = document.getElementById(
        "verificationInstructions",
      );
      // Prefer an explicitly configured API, then same origin.
      const apiOriginReady = (async function resolveApiOrigin() {
        const normalizeOrigin = (value) => {
          try {
            const url = new URL(value);
            return ["http:", "https:"].includes(url.protocol)
              ? url.origin
              : null;
          } catch {
            return null;
          }
        };
        const configuredOrigin = document
          .querySelector('meta[name="game-api-origin"]')
          ?.content.trim();
        const localDevelopment =
          window.location.hostname === "localhost" ||
          window.location.hostname === "127.0.0.1";
        const candidates = [
          ...new Set(
            [
              normalizeOrigin(configuredOrigin),
              normalizeOrigin(window.location.origin),
              ...(localDevelopment
                ? ["http://localhost:3002", "http://127.0.0.1:3002"]
                : []),
            ].filter(Boolean),
          ),
        ];
        for (const base of candidates) {
          const controller = new AbortController();
          const timeout = window.setTimeout(() => controller.abort(), 2200);
          try {
            const r = await fetch(base + "/api/health", {
              cache: "no-store",
              signal: controller.signal,
            });
            if (!r.ok) continue;
            const d = await r.json();
            if (d && d.ok) return base;
          } catch {
          } finally {
            window.clearTimeout(timeout);
          }
        }
        return candidates[0];
      })();
      const battlefieldScenes = [...document.querySelectorAll(".scene")];
      let currentView = "login";
      let pendingAccount = null;
      let developmentLink = null;
      let battlefieldIndex = 0;
      const battlefieldCycleMs = 10500;
      const startDelayMs = 3000;

      function showBattlefieldScene(index) {
        battlefieldScenes.forEach((scene, sceneIndex) => {
          scene.classList.toggle("active", sceneIndex === index);
        });
      }

      function startBattlefieldLoop() {
        const firstIndex = Math.floor(Math.random() * battlefieldScenes.length);
        battlefieldScenes.forEach((scene) => scene.classList.remove("active"));
        window.setTimeout(() => {
          battlefieldIndex = firstIndex;
          showBattlefieldScene(firstIndex);
          window.setInterval(() => {
            battlefieldIndex =
              (battlefieldIndex + 1) % battlefieldScenes.length;
            battlefieldScenes.forEach((scene) =>
              scene.classList.remove("active"),
            );
            window.setTimeout(() => {
              showBattlefieldScene(battlefieldIndex);
            }, 150);
          }, battlefieldCycleMs);
        }, startDelayMs);
      }

      startBattlefieldLoop();

      function setStatus(value, tone = "idle") {
        status.textContent = value;
        status.classList.remove("loading", "success", "error");
        if (tone !== "idle") status.classList.add(tone);
      }

      function showMessage(text, isError = false) {
        messageBox.textContent = text;
        messageBox.classList.toggle("error", isError);
      }

      function setView(view) {
        currentView = view;
        tabs.forEach((tab) =>
          tab.classList.toggle("active", tab.dataset.view === view),
        );
        loginForm.classList.toggle("hidden", view !== "login");
        registerForm.classList.toggle("hidden", view !== "register");
        verifyForm.classList.toggle("hidden", view !== "verify");

        if (view === "register") {
          helperText.textContent = "Already have a banner? ";
          switchLink.textContent = "Sign in";
          setStatus("Create banner", "idle");
        } else if (view === "login") {
          helperText.textContent = "No account yet? ";
          switchLink.textContent = "Create one here";
          setStatus("Realm access", "idle");
        } else {
          helperText.textContent = "Need a new code? ";
          switchLink.textContent = "Back to sign in";
          setStatus("Verification", "idle");
        }
      }

      async function callGameApi(path, payload = null) {
        const apiOrigin = await apiOriginReady;
        let response;
        try {
          response = await fetch(new URL(path, `${apiOrigin}/`), {
            method: payload ? "POST" : "GET",
            signal: AbortSignal.timeout(12000),
            headers: {
              "Content-Type": "application/json",
            },
            body: payload ? JSON.stringify(payload) : undefined,
            credentials:
              apiOrigin === window.location.origin ? "same-origin" : "include",
          });
        } catch {
          const hostname = new URL(apiOrigin).hostname;
          const localDevelopment =
            hostname === "localhost" || hostname === "127.0.0.1";
          throw new Error(
            localDevelopment
              ? `Unable to reach the game server at ${apiOrigin}. Start it with npm run dev, then reload the page.`
              : `Unable to reach the game server at ${apiOrigin}. Confirm that the deployed backend is running and its /api routes are available.`,
          );
        }

        const text = await response.text();
        let data = null;

        try {
          data = text ? JSON.parse(text) : null;
        } catch (error) {
          throw new Error("The kingdom server returned invalid data.");
        }

        if (!response.ok) {
          const error = new Error(
            data && (data.error || data.message)
              ? data.error || data.message
              : "The kingdom server rejected the request.",
          );
          error.status = response.status;
          error.code = data?.code;
          throw error;
        }

        return data;
      }

      function rememberLogin(name, email) {
        localStorage.setItem("dawnLastCommander", String(name));
        localStorage.setItem("dawnLastEmail", String(email || ""));
      }

      tabs.forEach((tab) => {
        tab.addEventListener("click", () => setView(tab.dataset.view));
      });

      switchLink.addEventListener("click", (event) => {
        event.preventDefault();
        if (currentView === "register") {
          setView("login");
          setStatus("Realm access");
        } else if (currentView === "verify") {
          setView("login");
        } else {
          setView("register");
          setStatus("Create banner");
        }
      });

      loginForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        const form = event.currentTarget;
        const submitButton = form.querySelector('button[type="submit"]');
        const loginValue = String(
          document.getElementById("loginName").value || "",
        ).trim();
        const password = String(
          document.getElementById("loginPassword").value || "",
        );
        const agreed = form.querySelector('input[name="terms"]')?.checked;

        if (!loginValue) {
          showMessage(
            "Enter your email, username, or sovereign name to continue.",
            true,
          );
          setStatus("Missing credentials", "error");
          return;
        }
        if (!password) {
          showMessage("Enter the commander password to continue.", true);
          setStatus("Missing password", "error");
          return;
        }
        if (!agreed) {
          showMessage(
            "You must agree to the kingdom charter before entering the throne room.",
            true,
          );
          setStatus("Charter required", "error");
          return;
        }

        submitButton.disabled = true;
        setStatus("Checking royal records...", "loading");
        showMessage("");

        try {
          const result = await callGameApi("/api/auth/login", {
            login: loginValue,
            password,
          });

          rememberLogin(loginValue, result.user?.email || "");
          setStatus("Access granted", "success");
          showMessage("Access granted. Opening the kingdom portal...");
          setTimeout(() => {
            window.location.href = "enter.html";
          }, 800);
        } catch (error) {
          const message = error.message || "Unable to sign in right now.";
          showMessage(message, true);
          if (message.toLowerCase().includes("verify your email")) {
            pendingAccount = { login: loginValue };
            verificationInstructions.textContent = `Activate ${loginValue} using the one-time verification link sent to that address.`;
            setView("verify");
            showMessage(message, true);
          }
          setStatus(
            message.toLowerCase().includes("fetch") ||
              message.toLowerCase().includes("rejected")
              ? "Signal lost"
              : "Access denied",
            "error",
          );
        } finally {
          submitButton.disabled = false;
        }
      });

      registerForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        const formData = new FormData(registerForm);
        const submitButton = registerForm.querySelector(
          'button[type="submit"]',
        );
        const firstName = String(formData.get("firstName") || "").trim();
        const lastName = String(formData.get("lastName") || "").trim();
        const username = String(formData.get("username") || "").trim();
        const empire = String(formData.get("empire") || "").trim();
        const email = String(formData.get("email") || "")
          .trim()
          .toLowerCase();
        const password = String(formData.get("password") || "");
        const confirmPassword = String(formData.get("confirmPassword") || "");
        const agreed = formData.get("terms") === "on";

        if (
          !firstName ||
          !lastName ||
          !username ||
          !empire ||
          !email ||
          !password ||
          !confirmPassword
        ) {
          showMessage("Fill in every field before creating your banner.", true);
          setStatus("Missing details", "error");
          return;
        }

        if (
          password.length < 10 ||
          !/[A-Z]/.test(password) ||
          !/[a-z]/.test(password) ||
          !/[0-9]/.test(password) ||
          password !== confirmPassword
        ) {
          showMessage(
            "Use at least 10 characters with an uppercase letter, a lowercase letter, a number, and matching confirmation.",
            true,
          );
          setStatus("Weak banner", "error");
          return;
        }

        if (!agreed) {
          showMessage(
            "You must agree to the kingdom charter before creating a banner.",
            true,
          );
          setStatus("Charter required", "error");
          return;
        }

        submitButton.disabled = true;
        setStatus("Registering banner...", "loading");
        showMessage("");

        try {
          const result = await callGameApi("/api/auth/register", {
            fullName: `${firstName} ${lastName}`.trim(),
            username,
            email,
            password,
            confirmPassword,
            terms: true,
          });

          pendingAccount = { login: email, firstName, lastName };
          developmentLink = result.developmentLink || null;
          verificationInstructions.textContent = `Your banner is registered for ${email}. Open the one-time verification link sent to this address to activate it.`;
          verifyLocalButton.classList.toggle("hidden", !developmentLink);
          loginName.value = username;
          setView("verify");
          setStatus("Banner created", "success");
          showMessage(
            result.message || "Your banner has been registered successfully.",
          );
        } catch (error) {
          const message =
            error.message || "Unable to create this banner right now.";
          if (error.code === "EMAIL_IN_USE") {
            pendingAccount = { login: email };
            developmentLink = null;
            verifyLocalButton.classList.add("hidden");
            verificationInstructions.textContent =
              "An account already uses this email. Sign in if it is active, or request a fresh verification link below.";
            setView("verify");
          }
          showMessage(message, true);
          setStatus(
            message.toLowerCase().includes("fetch") ||
              message.toLowerCase().includes("rejected")
              ? "Signal lost"
              : "Banner denied",
            "error",
          );
        } finally {
          submitButton.disabled = false;
        }
      });

      verifyLocalButton.addEventListener("click", async () => {
        if (!developmentLink) return;
        verifyLocalButton.disabled = true;
        setStatus("Verifying banner...", "loading");
        try {
          const token = new URL(
            developmentLink,
            window.location.origin,
          ).searchParams.get("verify");
          await callGameApi("/api/auth/verify", { token });
          setStatus("Email verified", "success");
          showMessage("Your email is verified. Opening the kingdom...");
          window.setTimeout(() => {
            window.location.href = "enter.html";
          }, 500);
        } catch (error) {
          showMessage(error.message || "Unable to verify this account.", true);
          setStatus("Verification failed", "error");
          verifyLocalButton.disabled = false;
        }
      });

      resendButton.addEventListener("click", async () => {
        if (!pendingAccount) {
          showMessage(
            "Enter the email address or username you registered with.",
            true,
          );
          return;
        }
        resendButton.disabled = true;
        setStatus("Sending verification link...", "loading");
        try {
          const result = await callGameApi("/api/auth/resend-verification", {
            login: pendingAccount.login,
          });
          developmentLink = result.developmentLink || null;
          verifyLocalButton.classList.toggle("hidden", !developmentLink);
          verificationInstructions.textContent = result.developmentLink
            ? "Email delivery is not configured in this local preview. Use the local link to verify your account."
            : "Check your inbox and spam folder for the one-time verification link.";
          showMessage(result.message);
          setStatus("Verification link sent", "success");
        } catch (error) {
          showMessage(
            error.message || "Unable to send a verification link.",
            true,
          );
          setStatus("Delivery failed", "error");
        } finally {
          resendButton.disabled = false;
        }
      });

      const savedName = localStorage.getItem("dawnLastCommander");
      if (savedName) loginName.value = savedName;
      setView("login");
      const verificationToken = new URLSearchParams(window.location.search).get(
        "verify",
      );
      if (verificationToken) {
        setStatus("Verifying your email...", "loading");
        showMessage("Checking your one-time verification link...");
        callGameApi("/api/auth/verify", { token: verificationToken })
          .then(() => {
            window.history.replaceState({}, "", window.location.pathname);
            setStatus("Email verified", "success");
            showMessage("Your email is verified. Opening the kingdom...");
            window.setTimeout(() => {
              window.location.href = "enter.html";
            }, 500);
          })
          .catch((error) => {
            showMessage(
              error.message ||
                "This verification link is invalid or expired. Request a new link and try again.",
              true,
            );
            setStatus("Verification failed", "error");
          });
      }
    </script>
  </body>
</html>
