<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#071b1a" />
    <meta
      name="description"
      content="Build an empire, command armies, and shape the ancient world in Dawn of Warriors."
    />
    <title>Dawn of Warriors · Ancient Times</title>
    <style>
      html,
      body,
      #root {
        min-height: 100%;
        margin: 0;
      }

      body {
        background: #071b1a;
        color: #f6d58d;
        font-family: "Segoe UI", sans-serif;
      }

      .game-entry-status {
        min-height: 100vh;
        display: grid;
        place-content: center;
        gap: 12px;
        padding: 24px;
        box-sizing: border-box;
        text-align: center;
      }

      .game-entry-status h1 {
        margin: 0;
        font-family: Georgia, serif;
      }

      .game-entry-status p {
        max-width: 560px;
        margin: 0;
        line-height: 1.6;
      }

      .game-entry-status a {
        color: #7ee7ec;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="game-entry-status">
        <h1>Preparing your kingdom</h1>
        <p id="game-entry-message">Loading the game menu...</p>
      </main>
    </div>
    <script>
      window.__DOW_SHOW_GAME_ERROR__ = async function () {
        if (window.__DOW_APP_LOADED__) return;
        try {
          const response = await fetch("./dist/game.html", {
            cache: "no-store",
          });
          if (response.ok) {
            window.location.replace("./dist/game.html");
            return;
          }
        } catch (error) {
          console.error("Could not check for the built game page.", error);
        }

        document.getElementById("game-entry-message").innerHTML =
          'The game source cannot run directly in this file preview. Open the published GitHub Pages site, or build the static site first. <a href="./">Return to the loading screen</a>.';
      };
      window.setTimeout(window.__DOW_SHOW_GAME_ERROR__, 8000);
    </script>
    <script
      type="module"
      src="./src/main.jsx"
      onerror="window.__DOW_SHOW_GAME_ERROR__()"
    ></script>
  </body>
</html>
