<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#120f26" />
    <meta
      name="description"
      content="DAWN OF WARRIORS: ANCIENT TIMES — Mustering the realm before the lobby gates open."
    />
    <title>DAWN OF WARRIORS: ANCIENT TIMES</title>
    <link rel="stylesheet" href="public/boot/boot.css" />
  </head>
  <body data-audio-scene="lobby">
    <canvas
      id="pixel-bg"
      class="pixel-bg"
      data-scene="roman-age"
      aria-hidden="true"
    ></canvas>
    <div class="bg-shade" aria-hidden="true"></div>

    <div class="boot-shell">
      <div class="boot-card">
        <div class="eyebrow">REALM ACCESS GRANTED</div>
        <h1>MUSTERING</h1>
        <div class="tagline">THE REALM</div>
        <div class="subline">
          Your banner is recognized • the lobby gates are opening
        </div>

        <div class="progress-wrap">
          <div
            class="progress"
            role="progressbar"
            aria-label="Preparing the game world"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="0"
          >
            <span id="boot-bar"></span>
            <div class="crate" id="boot-crate" aria-hidden="true"></div>
          </div>
          <div class="progress-meta">
            <div class="status" id="boot-status">
              Summoning your commander...
            </div>
            <div class="pct" id="boot-pct">0%</div>
          </div>
        </div>
      </div>
    </div>

    <script src="public/boot/pixel-bg.js"></script>
    <script src="public/boot/loader.js"></script>
    <script src="public/boot/audio-theme.js"></script>
    <script>
      BootLoader.start({
        assets: [
          "/assets/kingdom.jpg",
          "/assets/commander.jpg",
          "/assets/historical/macedonian-empire.jpeg",
          "/assets/historical/the-holy-roman-empire.jpeg",
        ],
        minMs: 5000,
        maxMs: 10000,
        target: "lobby.html",
        doneStatus: "The lobby gates swing open...",
        statuses: [
          "Summoning your commander...",
          "Unrolling the campaign maps...",
          "Counting grain, timber and silver...",
          "Waking the villagers of your camp...",
          "Opening the lobby gates...",
        ],
      });
    </script>
  </body>
</html>
